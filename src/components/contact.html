<section id="contact" class="hud-section">
    <header class="section-header">
        <span class="decoration" aria-hidden="true">//</span>
        <h2>CONTACT_ME</h2>
        <div class="header-line"></div>
    </header>

    <div class="contact-container">
        <form id="contact-form" class="hud-form">
            <div class="form-row">
                <div class="input-group">
                    <label for="name">NOMBRE_USER</label>
                    <input type="text" id="name" name="name" placeholder="Escribe tu nombre..." required>
                    <div class="input-line"></div>
                </div>
                <div class="input-group">
                    <label for="email">EMAIL_ENVOY</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                    <div class="input-line"></div>
                </div>
            </div>

            <div class="input-group full-width">
                <label for="message">MESSAGE_LOG</label>
                <textarea id="message" name="message" rows="5" placeholder="Iniciando transmisión..." required></textarea>
                <div class="input-line"></div>
            </div>

            <div class="form-actions">
                <button type="submit" id="btn-email" class="btn-hud"><span>ENVIAR_CORREO</span></button>
                <button type="button" id="btn-whatsapp" class="btn-hud alt"><span>WHATSAPP_LINK</span></button>
            </div>
        </form>
    </div>
</section>
